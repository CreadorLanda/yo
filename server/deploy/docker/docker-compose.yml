# Local + VPS development stack.
#
# Targets two topologies with one file, via profiles:
#
#   1) Hybrid (recommended): Postgres on Supabase, everything else local.
#        docker compose up -d redis              # just Redis
#
#   2) Fully local (offline dev): also runs Postgres locally.
#        docker compose --profile local-pg up -d
#
# See docs/tech/deployment.md for the full deployment story.

services:
  # Always available (no profile). Use it locally for dev OR on the VPS.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opt-in: a local Postgres for offline development.
  # In hybrid topology this stays stopped — POSTGRES_URL points at Supabase.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-pg"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialize
      POSTGRES_PASSWORD: socialize
      POSTGRES_DB: socialize
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialize -d socialize"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The SFU. Open source, self-hosted, and the only process that ever sees a
  # media packet — encrypted ones, since the clients derive the key from the
  # chat's own E2EE session and never send it here.
  #
  # Opt-in: calls are disabled until LIVEKIT_URL is set on the API.
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["calls"]
    restart: unless-stopped
    # LIVEKIT_NODE_IP must be the VPS public address, or clients are told to
    # send media to an unroutable one and the call connects silently deaf.
    # Not a `:?` guard: compose interpolates every service regardless of
    # profile, so a required variable here broke `up -d redis` for everyone
    # who never wanted calls. The deploy script checks it instead.
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # Host networking because the media ports are a wide UDP range and
    # publishing them one by one through Docker's proxy is both slow and
    # unreliable for real-time traffic.
    network_mode: host

volumes:
  postgres-data:
  redis-data:
