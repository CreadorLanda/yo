name: Bot SDKs

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'server/internal/modules/bots/**'
      - 'server/internal/server/**'
      - '.github/workflows/sdk.yml'
  push:
    tags:
      - 'sdk-ts-v*'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: sdk/go/go.sum
      - name: TypeScript
        working-directory: sdk/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build
      - name: Go
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go test -race ./...

  # The echo example of each SDK, against a real server: a person signs up,
  # talks to the bot in a direct chat, clicks its button, and uses a command
  # in a group where the bot is in privacy mode (sdk/typescript/test/e2e.ts).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: socialize
          POSTGRES_PASSWORD: socialize
          POSTGRES_DB: socialize
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U socialize -d socialize"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: dev
      POSTGRES_URL: postgres://socialize:socialize@127.0.0.1:5432/socialize?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: test-secret-that-is-long-enough-for-ci-validation
      E2E_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            server/go.sum
            sdk/go/go.sum
      - name: Apply migrations
        run: |
          docker run --network host --rm \
            -v "$GITHUB_WORKSPACE/server/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path=/migrations -database "$POSTGRES_URL" up
      - name: Start the API
        working-directory: server
        run: |
          go build -o /tmp/api ./cmd/api
          /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/readyz && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - working-directory: sdk/typescript
        run: bun install --frozen-lockfile
      - name: TypeScript echo bot
        working-directory: sdk/typescript
        run: bun test/e2e.ts ts
      - name: Go echo bot
        working-directory: sdk/typescript
        run: bun test/e2e.ts go
      - if: failure()
        run: tail -200 /tmp/api.log

  # Tag sdk-ts-vX.Y.Z to publish @zwosocial/bot (needs the NPM_TOKEN secret).
  # The Go module needs no publishing: tag sdk/go/vX.Y.Z and `go get` finds it.
  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Version matches the tag
        run: test "$(jq -r .version package.json)" = "${GITHUB_REF_NAME#sdk-ts-v}"
      - run: bun install --frozen-lockfile && bun run build
      - run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
